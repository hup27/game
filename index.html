<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf8ef">
  <title>2048 — Slide &amp; merge</title>
  <style>
    :root {
      color-scheme: light;
      --page: #faf8ef;
      --ink: #776e65;
      --muted: #a69d94;
      --board: #bbada0;
      --empty: rgba(238, 228, 218, .35);
      --accent: #8f7a66;
      --gap: clamp(7px, 2vw, 13px);
      font-family: "Inter", "Avenir Next", Avenir, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 38px 20px 30px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.92), transparent 55%),
        var(--page);
      color: var(--ink);
    }

    button { font: inherit; }

    .game {
      width: min(100%, 500px);
      margin: 0 auto;
    }

    .topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    h1 {
      margin: -7px 0 0;
      color: var(--ink);
      font-size: clamp(4.3rem, 19vw, 6rem);
      font-weight: 850;
      letter-spacing: -.09em;
      line-height: 1;
    }

    .scores {
      display: flex;
      gap: 8px;
      padding-top: 5px;
    }

    .score-card {
      min-width: 78px;
      padding: 9px 13px 8px;
      border-radius: 7px;
      background: var(--board);
      color: #fff;
      text-align: center;
    }

    .score-label {
      display: block;
      color: #eee4da;
      font-size: .68rem;
      font-weight: 750;
      letter-spacing: .08em;
      line-height: 1.15;
      text-transform: uppercase;
    }

    .score-value {
      display: block;
      min-width: 2ch;
      margin-top: 3px;
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.15;
    }

    .intro-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 17px;
    }

    .intro {
      margin: 0;
      font-size: .96rem;
      line-height: 1.45;
    }

    .controls {
      display: flex;
      flex: 0 0 auto;
      gap: 8px;
    }

    .control-button {
      min-height: 42px;
      padding: 0 15px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: .9rem;
      font-weight: 750;
      transition: background .15s ease, transform .15s ease, opacity .15s ease;
    }

    .control-button:hover:not(:disabled) { background: #7d6a58; }
    .control-button:active:not(:disabled) { transform: translateY(1px); }
    .control-button:focus-visible { outline: 3px solid #edc22e; outline-offset: 3px; }
    .control-button.secondary { background: #a89c8f; }
    .control-button:disabled { cursor: not-allowed; opacity: .48; }

    .board-wrap { position: relative; }

    .move-controls {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(2, 44px);
      gap: 5px;
      justify-content: center;
      margin: 14px auto 0;
    }

    .move-button {
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 7px;
      background: #e8dfd3;
      color: var(--ink);
      cursor: pointer;
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1;
      touch-action: manipulation;
      transition: background .15s ease, transform .15s ease;
    }

    .move-button:hover { background: #ddd1c2; }
    .move-button:active { transform: scale(.94); }
    .move-button:focus-visible { outline: 3px solid #edc22e; outline-offset: 2px; }
    .move-button[data-direction="up"] { grid-column: 2; grid-row: 1; }
    .move-button[data-direction="left"] { grid-column: 1; grid-row: 2; }
    .move-button[data-direction="down"] { grid-column: 2; grid-row: 2; }
    .move-button[data-direction="right"] { grid-column: 3; grid-row: 2; }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--gap);
      width: 100%;
      aspect-ratio: 1;
      padding: var(--gap);
      overflow: hidden;
      border-radius: 10px;
      background: var(--board);
      touch-action: none;
      user-select: none;
    }

    .cell {
      display: grid;
      min-width: 0;
      min-height: 0;
      place-items: center;
      border-radius: 6px;
      background: var(--empty);
      color: var(--ink);
      font-size: clamp(1.35rem, 8vw, 3rem);
      font-weight: 800;
      letter-spacing: -.055em;
      transition: background .12s ease, color .12s ease;
    }

    .cell[data-value="2"] { background: #eee4da; }
    .cell[data-value="4"] { background: #ede0c8; }
    .cell[data-value="8"] { background: #f2b179; color: #fffaf5; }
    .cell[data-value="16"] { background: #f59563; color: #fffaf5; }
    .cell[data-value="32"] { background: #f67c5f; color: #fffaf5; }
    .cell[data-value="64"] { background: #f65e3b; color: #fffaf5; }
    .cell[data-value="128"] { background: #edcf72; color: #fffaf5; font-size: clamp(1.2rem, 7vw, 2.45rem); }
    .cell[data-value="256"] { background: #edcc61; color: #fffaf5; font-size: clamp(1.2rem, 7vw, 2.45rem); }
    .cell[data-value="512"] { background: #edc850; color: #fffaf5; font-size: clamp(1.2rem, 7vw, 2.45rem); }
    .cell[data-value="1024"],
    .cell[data-value="2048"] { background: #edc22e; color: #fffaf5; font-size: clamp(1rem, 6vw, 2rem); }
    .cell.high-tile { background: #3c3a32; color: #fffaf5; font-size: clamp(1rem, 6vw, 2rem); }

    .overlay {
      position: absolute;
      z-index: 1;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      border-radius: 10px;
      background: rgba(250, 248, 239, .84);
      text-align: center;
      animation: appear .18s ease-out;
    }

    .overlay[hidden] { display: none; }

    .dialog {
      max-width: 330px;
      padding: 26px 24px;
      border: 1px solid rgba(119, 110, 101, .12);
      border-radius: 14px;
      background: #fffdf8;
      box-shadow: 0 14px 40px rgba(90, 73, 55, .14);
    }

    .dialog h2 {
      margin: 0 0 8px;
      font-size: 2rem;
      letter-spacing: -.04em;
    }

    .dialog p { margin: 0 0 18px; line-height: 1.5; }
    .dialog-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

    .tips {
      margin: 12px 2px 0;
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.5;
      text-align: center;
    }

    .tips strong { color: var(--ink); }

    kbd {
      padding: 2px 5px;
      border: 1px solid #d6cec4;
      border-radius: 4px;
      background: rgba(255,255,255,.55);
      color: var(--ink);
      font: inherit;
      font-size: .72rem;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes appear {
      from { opacity: 0; transform: scale(.98); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 430px) {
      body { padding: 26px 16px 22px; }
      .topline { margin-bottom: 19px; }
      .intro-row { align-items: flex-start; }
      .intro { max-width: 150px; font-size: .87rem; }
      .control-button { min-height: 40px; padding: 0 11px; font-size: .83rem; }
      .score-card { min-width: 68px; padding-inline: 9px; }
      .score-value { font-size: 1.2rem; }
      .move-controls { margin-top: 10px; }
      .tips { font-size: .76rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="game">
    <header class="topline">
      <h1>2048</h1>
      <div class="scores" aria-label="Game scores">
        <div class="score-card">
          <span class="score-label">Score</span>
          <span class="score-value" id="score">0</span>
        </div>
        <div class="score-card">
          <span class="score-label">Best</span>
          <span class="score-value" id="best">0</span>
        </div>
      </div>
    </header>

    <section class="intro-row" aria-label="Game controls">
      <p class="intro">Slide tiles together to reach <strong>2048</strong>.</p>
      <div class="controls">
        <button class="control-button secondary" id="undo" type="button" disabled>Undo</button>
        <button class="control-button" id="new-game" type="button">New Game</button>
      </div>
    </section>

    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="2048 game board"></div>
      <div class="overlay" id="overlay" hidden>
        <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-copy">
          <h2 id="dialog-title"></h2>
          <p id="dialog-copy"></p>
          <div id="dialog-actions"></div>
        </section>
      </div>
    </div>

    <div class="move-controls" role="group" aria-label="Move tiles">
      <button class="move-button" type="button" data-direction="up" aria-label="Move up">↑</button>
      <button class="move-button" type="button" data-direction="left" aria-label="Move left">←</button>
      <button class="move-button" type="button" data-direction="down" aria-label="Move down">↓</button>
      <button class="move-button" type="button" data-direction="right" aria-label="Move right">→</button>
    </div>
    <p class="tips"><strong>How to play:</strong> Use arrow keys, these buttons, or swipe. All tiles move together; matching numbers merge. Each valid move adds a new tile.</p>
    <p class="sr-only" id="announcement" aria-live="polite" aria-atomic="true"></p>
  </main>

  <script>
    (() => {
      "use strict";

      const SIZE = 4;
      const boardElement = document.getElementById("board");
      const scoreElement = document.getElementById("score");
      const bestElement = document.getElementById("best");
      const undoButton = document.getElementById("undo");
      const overlay = document.getElementById("overlay");
      const dialogTitle = document.getElementById("dialog-title");
      const dialogCopy = document.getElementById("dialog-copy");
      const dialogActions = document.getElementById("dialog-actions");
      const announcement = document.getElementById("announcement");

      let board = Array(SIZE * SIZE).fill(0);
      let score = 0;
      let best = 0;
      let undoState = null;
      let won = false;
      let winPending = false;
      let gameOver = false;
      let pointerStart = null;

      function render() {
        boardElement.replaceChildren();
        board.forEach((value, index) => {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.setAttribute("role", "gridcell");
          cell.setAttribute("aria-label", value ? `${value} tile` : "Empty");
          if (value) {
            cell.textContent = String(value);
            cell.dataset.value = String(value);
            if (value > 2048) cell.classList.add("high-tile");
          }
          cell.dataset.index = String(index);
          boardElement.append(cell);
        });
        scoreElement.textContent = String(score);
        bestElement.textContent = String(best);
        undoButton.disabled = !undoState;
      }

      function emptyCells(state) {
        const cells = [];
        state.forEach((value, index) => {
          if (value === 0) cells.push(index);
        });
        return cells;
      }

      function spawnTile() {
        const empty = emptyCells(board);
        if (empty.length === 0) return;
        const index = empty[Math.floor(Math.random() * empty.length)];
        board[index] = Math.random() < 0.9 ? 2 : 4;
      }

      function startGame() {
        board = Array(SIZE * SIZE).fill(0);
        score = 0;
        undoState = null;
        won = false;
        winPending = false;
        gameOver = false;
        hideOverlay();
        spawnTile();
        spawnTile();
        announcement.textContent = "New game. Two tiles added.";
        render();
      }

      function lineIndices(direction, line) {
        const indices = [];
        for (let offset = 0; offset < SIZE; offset += 1) {
          if (direction === "left") indices.push(line * SIZE + offset);
          if (direction === "right") indices.push(line * SIZE + (SIZE - 1 - offset));
          if (direction === "up") indices.push(offset * SIZE + line);
          if (direction === "down") indices.push((SIZE - 1 - offset) * SIZE + line);
        }
        return indices;
      }

      function move(direction) {
        if (gameOver || winPending) return;
        const next = Array(SIZE * SIZE).fill(0);
        let gained = 0;

        for (let line = 0; line < SIZE; line += 1) {
          const indices = lineIndices(direction, line);
          const tiles = indices.map((index) => board[index]).filter((value) => value !== 0);
          const merged = [];
          for (let index = 0; index < tiles.length; index += 1) {
            if (tiles[index] === tiles[index + 1]) {
              const value = tiles[index] * 2;
              merged.push(value);
              gained += value;
              index += 1;
            } else {
              merged.push(tiles[index]);
            }
          }
          indices.forEach((boardIndex, position) => {
            next[boardIndex] = merged[position] || 0;
          });
        }

        if (next.every((value, index) => value === board[index])) return;

        undoState = { board: board.slice(), score, won };
        board = next;
        score += gained;
        best = Math.max(best, score);
        spawnTile();

        if (!won && board.some((value) => value >= 2048)) {
          won = true;
          winPending = true;
          showWin();
        } else if (isGameOver()) {
          gameOver = true;
          showGameOver();
        }

        announcement.textContent = gained
          ? `Move ${direction}. Score increased by ${gained} to ${score}.`
          : `Move ${direction}.`;
        render();
      }

      function isGameOver() {
        if (emptyCells(board).length > 0) return false;
        for (let row = 0; row < SIZE; row += 1) {
          for (let column = 0; column < SIZE; column += 1) {
            const index = row * SIZE + column;
            if (column < SIZE - 1 && board[index] === board[index + 1]) return false;
            if (row < SIZE - 1 && board[index] === board[index + SIZE]) return false;
          }
        }
        return true;
      }

      function hideOverlay() {
        overlay.hidden = true;
        dialogActions.replaceChildren();
      }

      function addDialogButton(label, callback, secondary = false) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `control-button${secondary ? " secondary" : ""}`;
        button.textContent = label;
        button.addEventListener("click", callback, { once: true });
        dialogActions.append(button);
      }

      function showWin() {
        dialogTitle.textContent = "You made it!";
        dialogCopy.textContent = `You reached 2048 with a score of ${score}. Keep going or start fresh.`;
        dialogActions.replaceChildren();
        addDialogButton("Keep playing", () => {
          winPending = false;
          hideOverlay();
          if (isGameOver()) {
            gameOver = true;
            showGameOver();
          }
          announcement.textContent = "Continuing past 2048.";
          render();
        });
        addDialogButton("New Game", startGame, true);
        addDialogButton("Undo move", undo, true);
        overlay.hidden = false;
      }

      function showGameOver() {
        dialogTitle.textContent = "Game over";
        dialogCopy.textContent = `No more moves. Your final score is ${score}.`;
        dialogActions.replaceChildren();
        addDialogButton("Try again", startGame);
        addDialogButton("Undo move", undo, true);
        overlay.hidden = false;
      }

      function undo() {
        if (!undoState) return;
        board = undoState.board;
        score = undoState.score;
        won = undoState.won;
        undoState = null;
        winPending = false;
        gameOver = false;
        hideOverlay();
        announcement.textContent = `Move undone. Score is ${score}.`;
        render();
      }

      document.addEventListener("keydown", (event) => {
        const directions = {
          ArrowLeft: "left",
          ArrowRight: "right",
          ArrowUp: "up",
          ArrowDown: "down"
        };
        const direction = directions[event.key];
        if (!direction) return;
        event.preventDefault();
        move(direction);
      });

      boardElement.addEventListener("pointerdown", (event) => {
        pointerStart = { x: event.clientX, y: event.clientY };
        boardElement.setPointerCapture(event.pointerId);
      });

      boardElement.addEventListener("pointerup", (event) => {
        if (!pointerStart) return;
        const deltaX = event.clientX - pointerStart.x;
        const deltaY = event.clientY - pointerStart.y;
        pointerStart = null;
        if (Math.max(Math.abs(deltaX), Math.abs(deltaY)) < 24) return;
        move(Math.abs(deltaX) > Math.abs(deltaY)
          ? (deltaX > 0 ? "right" : "left")
          : (deltaY > 0 ? "down" : "up"));
      });
      boardElement.addEventListener("pointercancel", () => { pointerStart = null; });

      document.getElementById("new-game").addEventListener("click", startGame);
      undoButton.addEventListener("click", undo);
      document.querySelectorAll(".move-button").forEach((button) => {
        button.addEventListener("click", () => move(button.dataset.direction));
      });

      startGame();
    })();
  </script>
</body>
</html>
